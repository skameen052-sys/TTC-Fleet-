spring.application.name=ttc-fleet360
server.port=8080

# Profiles
spring.profiles.active=dev

# In local dev: use embedded PostgreSQL-compatible H2 database for zero-config instant running,
# while production profile uses full PostgreSQL.
spring.datasource.url=jdbc:h2:mem:fleet360db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=fleet360
spring.datasource.password=fleet360_secret

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (for debugging if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Configuration
app.jwt.secret=9a3f8c7e2b1d6f5a4e3c2b1a0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e
app.jwt.expiration-ms=86400000

# Redis Cache (dev profile falls back gracefully if Redis server is down)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
spring.cache.type=simple

# AWS S3 Configuration
aws.s3.enabled=false
aws.s3.bucket=ttc-fleet360-assets
aws.s3.region=ap-south-1
aws.s3.access-key=MOCK_AWS_ACCESS_KEY_ID
aws.s3.secret-key=MOCK_AWS_SECRET_ACCESS_KEY

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
