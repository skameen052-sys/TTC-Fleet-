spring.application.name=ttc-fleet360
server.port=8080

# Production PostgreSQL Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ttc_fleet360}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fleetadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Fleet360SecurePass!}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis Cache in Production
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# JWT
app.jwt.secret=${JWT_SECRET:9a3f8c7e2b1d6f5a4e3c2b1a0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# AWS S3 Production
aws.s3.enabled=${AWS_S3_ENABLED:true}
aws.s3.bucket=${AWS_S3_BUCKET:ttc-fleet360-prod-assets}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# File uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
