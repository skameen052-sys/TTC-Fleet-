server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ttc-fleet360-backend
  profiles:
    active: dev

  # Primary database configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ttc_fleet360}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis Distributed Cache Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000ms # 10 minutes cache TTL
      cache-null-values: false

# JWT Security Configuration
app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970" # 256-bit HMAC key
    expiration-ms: 86400000 # 24 hours

# AWS S3 Document Storage
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:ttc-fleet360-vault}
    region: ${AWS_REGION:us-east-2}
    access-key: ${AWS_ACCESS_KEY_ID:AKIA_SIMULATED_FLEET360}
    secret-key: ${AWS_SECRET_ACCESS_KEY:wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
# Dev Profile with H2 fallback for zero-dependency local execution
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:fleet360db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: simple
