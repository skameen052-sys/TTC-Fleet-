version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fleet360-postgres
    restart: always
    environment:
      POSTGRES_DB: ttc_fleet360
      POSTGRES_USER: fleetadmin
      POSTGRES_PASSWORD: Fleet360SecurePass!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetadmin -d ttc_fleet360"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fleet360-network

  # 2. Redis Caching Engine
  redis:
    image: redis:7.2-alpine
    container_name: fleet360-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fleet360-network

  # 3. Java Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleet360-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ttc_fleet360
      SPRING_DATASOURCE_USERNAME: fleetadmin
      SPRING_DATASOURCE_PASSWORD: Fleet360SecurePass!
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: 9a3f8c7e2b1d6f5a4e3c2b1a0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e
      JWT_EXPIRATION: 86400000
      AWS_S3_ENABLED: "false"
      AWS_S3_BUCKET: ttc-fleet360-assets
      AWS_REGION: ap-south-1
    ports:
      - "8080:8080"
    networks:
      - fleet360-network

  # 4. React.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleet360-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - fleet360-network

networks:
  fleet360-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
