<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TTC Fleet360 – Customer Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#141a2b; --navy-2:#1b2236; --navy-3:#252d45;
  --orange:#ff6b1a; --orange-2:#ff8a3d; --orange-soft:#fff1e8;
  --bg:#f4f6fb; --card:#ffffff; --text:#1c2333; --muted:#6b7385; --line:#eceff5;
  --green:#22c55e; --green-soft:#e8f9ee; --blue:#3b82f6; --blue-soft:#eaf2ff;
  --purple:#8b5cf6; --purple-soft:#f1ebff; --red:#ef4444; --red-soft:#fdecec;
  --amber:#f59e0b; --amber-soft:#fff6e0; --gray-soft:#eef0f4;
  --radius:16px; --shadow:0 4px 18px rgba(20,26,43,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--navy);color:#cfd5e3;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:22px 16px;z-index:50;transition:transform .25s;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:26px;text-align:center}
.brand .logo{width:92px;height:48px}
.brand h1{color:#fff;font-size:24px;font-weight:700;letter-spacing:.2px;line-height:1.1}
.brand h1 span{color:var(--orange)}
.brand small{font-size:11px;color:#9aa3b8}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;white-space:nowrap;border-radius:12px;font-size:14px;font-weight:500;transition:.15s;position:relative}
.nav a:hover{background:var(--navy-3);color:#fff}
.nav a.active{background:linear-gradient(90deg,var(--orange),var(--orange-2));color:#fff;box-shadow:0 8px 20px rgba(255,107,26,.35)}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.side-promo{flex-shrink:0;margin:18px 0 14px;border-radius:14px;overflow:hidden;position:relative;height:150px;background:linear-gradient(180deg,#2b3550 0%,#c2551a 70%,#ff7a2f 100%)}
.side-promo svg{position:absolute;bottom:58px;left:8px;width:200px}
.side-promo p{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-weight:600;font-size:14px;line-height:1.3;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.logout{display:flex;align-items:center;gap:14px;justify-content:center;border:1px solid var(--navy-3);border-radius:12px;padding:12px;color:#fff;font-weight:500}
.logout:hover{background:var(--navy-3)}

.main{margin-left:250px;flex:1;padding:18px 22px 30px;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.menu-btn{display:none;width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:var(--shadow);place-items:center}
.search{flex:0 1 420px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:30px;padding:11px 18px;box-shadow:var(--shadow);position:relative}
.search input{border:none;outline:none;flex:1;background:transparent}
.search-results{position:absolute;top:110%;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.12);padding:6px;display:none;z-index:40}
.search-results a{display:block;padding:9px 12px;border-radius:10px;font-size:13px}
.search-results a:hover{background:var(--bg)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:18px}
.bell{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.bell:hover{background:#fff}
.bell .dot{position:absolute;top:3px;right:3px;background:var(--red);color:#fff;font-size:10px;font-weight:600;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--bg)}
.profile{display:flex;align-items:center;gap:10px;padding-left:18px;border-left:1px solid #dfe3ec;position:relative}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ffb27a,#e0661d);color:#fff;display:grid;place-items:center;font-weight:700}
.profile b{display:block;font-size:14px}
.profile small{color:var(--muted);font-size:12px}
.dropdown{position:absolute;top:120%;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.14);min-width:230px;padding:8px;display:none;z-index:60}
.dropdown.open{display:block}
.dropdown a,.dropdown button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;font-size:13px;text-align:left}
.dropdown a:hover,.dropdown button:hover{background:var(--bg)}
.notif-dd{width:340px}
.notif-dd .n-item{padding:10px 12px;border-radius:10px;font-size:13px;display:flex;gap:10px}
.notif-dd .n-item:hover{background:var(--bg)}
.notif-dd .n-item.unread{background:var(--orange-soft)}

/* ---------- Generic ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head h3{font-size:16px;font-weight:600}
.card-head .ico{color:var(--orange)}
.card-head .view{margin-left:auto;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.card-head .view:hover{color:var(--orange)}
.page-title{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-title h2{font-size:22px;font-weight:700}
.page-title p{color:var(--muted);font-size:13px;width:100%}
.crumb{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:30px;font-weight:600;font-size:14px;transition:.15s}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(255,107,26,.35)}
.btn-primary:hover{background:#f25c0a}
.btn-outline{border:1.5px solid var(--orange);color:var(--orange);background:#fff}
.btn-outline:hover{background:var(--orange-soft)}
.btn-ghost{background:var(--gray-soft);color:var(--text)}
.btn-ghost:hover{background:#e3e6ee}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 14px;font-size:12px}
.grid{display:grid;gap:18px}
.badge-s{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.s-transit{background:var(--blue-soft);color:var(--blue)}
.s-delivered,.s-paid,.s-approved,.s-completed,.s-resolved{background:var(--green-soft);color:#16a34a}
.s-processing,.s-pending,.s-scheduled,.s-open,.s-in-review{background:var(--amber-soft);color:#d97706}
.s-cancelled,.s-failed,.s-overdue,.s-rejected{background:var(--red-soft);color:var(--red)}
.s-delayed{background:#fff0e6;color:#ea580c}
.s-out{background:var(--purple-soft);color:var(--purple)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:8px 16px;border-radius:20px;background:#fff;font-weight:500;font-size:13px;box-shadow:var(--shadow)}
.tabs button.active{background:var(--navy);color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .field-inline{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.toolbar input,.toolbar select{border:none;outline:none;background:transparent}
.toolbar .spacer{flex:1}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:12px 12px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none;white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:hover td{background:#fafbfd}
.table-wrap{overflow-x:auto}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--muted)}
.pager .pg{display:flex;gap:6px}
.pager .pg button{width:32px;height:32px;border-radius:8px;background:var(--gray-soft);font-weight:600}
.pager .pg button.active{background:var(--orange);color:#fff}
.pager .pg button:disabled{opacity:.4;cursor:default}
.icon-btn{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;background:var(--gray-soft);color:var(--text)}
.icon-btn:hover{background:var(--orange-soft);color:var(--orange)}
.icon-btn svg.i{width:16px;height:16px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;outline:none;background:#fbfcfe;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);background:#fff}
.field textarea{min-height:90px;resize:vertical}
.field.err input,.field.err select,.field.err textarea{border-color:var(--red)}
.field .msg{color:var(--red);font-size:12px;margin-top:4px;display:none}
.field.err .msg{display:block}
.form-section{font-size:14px;font-weight:600;color:var(--orange);margin:6px 0 -4px;grid-column:1/-1;display:flex;align-items:center;gap:8px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ---------- Dashboard ---------- */
.hero{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(100deg,#151b2c 0%,#1f2538 38%,#5a3020 62%,#d9621f 88%,#ff9a4a 100%);color:#fff;padding:34px 42px;min-height:200px;margin-bottom:18px}
.hero::before{content:"";position:absolute;right:16%;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.75),rgba(255,140,60,0) 70%)}
.hero .road{position:absolute;bottom:0;right:0;width:62%;height:44px;background:linear-gradient(180deg,#2a2422,#151210)}
.hero .road::after{content:"";position:absolute;top:20px;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#f5c78a 0 40px,transparent 40px 80px);opacity:.7}
.hero .accent{width:40px;height:4px;background:var(--orange);border-radius:2px;margin-bottom:18px}
.hero h2{font-size:34px;font-weight:700;position:relative}
.hero h2 span{color:var(--orange-2)}
.hero p{font-size:16px;color:#e6e9f2;max-width:470px;margin:8px 0 18px;position:relative}
.hero .truck{position:absolute;right:4%;bottom:16px;width:40%;max-width:440px}
.stats{grid-template-columns:repeat(4,1fr);margin-bottom:18px}
.stat{display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;padding:18px 20px;cursor:pointer;transition:.15s}
.stat:hover{transform:translateY(-2px)}
.stat .bubble{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}
.stat .bubble svg.i{width:26px;height:26px}
.stat small{color:var(--muted);font-size:13px;display:block}
.stat b{font-size:24px;font-weight:700}
.stat .trend{position:absolute;top:16px;right:18px;font-size:12px;font-weight:600;color:#16a34a}
.stat .spark{position:absolute;right:0;bottom:6px;width:52%;height:46px}
.row3{grid-template-columns:1fr 1.25fr 1fr;margin-bottom:18px}
.order-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.order-row:last-child{border-bottom:none}
.thumb{width:58px;height:44px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.order-row .meta{flex:1;min-width:0}
.order-row .meta b{font-size:14px;font-weight:600;display:block}
.order-row .meta small{color:var(--muted);font-size:12px}
.chev{color:var(--muted)}
.track-card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.track-card .card-head{background:var(--navy);color:#fff;padding:14px 18px;margin:0}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.live i{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.3);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
.map{position:relative;flex:1;min-height:200px;background:#e9efe6}
.map svg.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.eta{position:absolute;top:12px;right:12px;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.eta b{display:block;font-size:14px}
.eta span{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--text)}
.eta span svg{color:var(--orange);width:16px;height:16px}
.steps{display:flex;justify-content:space-between;padding:14px 26px 14px;position:relative}
.steps::before{content:"";position:absolute;top:24px;left:60px;right:60px;height:3px;background:#e2e5ec}
.steps .bar{position:absolute;top:24px;left:60px;height:3px;background:var(--orange)}
.step{text-align:center;position:relative;z-index:1;font-size:12px;width:110px}
.step .dotc{width:22px;height:22px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:#fff;border:3px solid #cfd4de}
.step.done .dotc{background:var(--orange);border-color:#ffd2b5;color:#fff}
.step.done .dotc svg{width:12px;height:12px;stroke-width:3}
.step b{font-weight:600;display:block}
.step small{color:var(--muted)}
.inv-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.inv-row:last-child{border-bottom:none}
.inv-ico{width:40px;height:40px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.inv-row .meta{flex:1}
.inv-row .meta b{font-size:14px;font-weight:600;display:block}
.inv-row .meta small{color:var(--muted);font-size:12px}
.inv-row .amt{font-weight:700;font-size:15px}
.row-ov{grid-template-columns:repeat(3,1fr);margin-bottom:18px}
.ov-list{display:flex;flex-direction:column;gap:12px}
.ov-item{display:flex;align-items:center;gap:10px;font-size:13px}
.ov-item .lbl{width:130px;color:var(--muted)}
.ov-item .track{flex:1;height:8px;border-radius:4px;background:var(--gray-soft);overflow:hidden}
.ov-item .track i{display:block;height:100%;border-radius:4px}
.ov-item b{width:28px;text-align:right}
.bill-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bill-tiles div{background:var(--bg);border-radius:12px;padding:12px}
.bill-tiles small{color:var(--muted);font-size:12px;display:block}
.bill-tiles b{font-size:18px}
.quick{grid-template-columns:repeat(6,1fr);margin-bottom:18px}
.qa{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;text-align:center;font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
.qa:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,107,26,.15)}
.qa .q-ico{width:46px;height:46px;border-radius:14px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center}
.row-bottom{grid-template-columns:1fr 1.5fr 1fr}
.act{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:13px;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:none}
.act .a-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.act .a-ico svg{width:16px;height:16px}
.act > span:not(.a-ico){flex:1}
.act small{color:var(--muted);font-size:12px;white-space:nowrap}
.promo{position:relative;overflow:hidden;background:linear-gradient(100deg,#151b2c 0%,#24293d 45%,#a8481a 80%,#ff8a3d 100%);color:#fff;padding:26px 24px;border-radius:var(--radius);min-height:160px}
.promo .accent{width:30px;height:4px;background:var(--orange);border-radius:2px;margin-bottom:10px}
.promo h3{font-size:22px;font-weight:700;position:relative}
.promo h3 span{color:var(--orange-2)}
.promo p{color:#dfe3ec;margin:4px 0 16px;position:relative}
.promo svg.trk{position:absolute;right:10px;bottom:10px;width:48%}
.help{background:linear-gradient(120deg,#fff 0%,#fff3ea 100%);border-radius:var(--radius);padding:22px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.help h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.help h3 svg{color:var(--orange)}
.help p{color:var(--muted);font-size:13px;margin:8px 0 16px;max-width:60%}
.help .agent{position:absolute;right:8px;bottom:0;width:110px}

/* ---------- Detail panels ---------- */
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.kv div small{display:block;color:var(--muted);font-size:12px}
.kv div b{font-weight:600;font-size:14px}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding-bottom:18px}
.tl::before{content:"";position:absolute;left:-23px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #cfd4de}
.tl.done::before{background:var(--orange);border-color:#ffd2b5}
.tl b{display:block;font-size:13px}
.tl small{color:var(--muted);font-size:12px}
.addr-grid{grid-template-columns:repeat(3,1fr)}
.addr{position:relative}
.addr .tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--orange-soft);color:var(--orange)}
.addr h4{margin:10px 0 4px;font-size:15px}
.addr p{color:var(--muted);font-size:13px;line-height:1.5}
.addr .acts{display:flex;gap:8px;margin-top:12px}
.notif-item{display:flex;gap:14px;padding:14px;border-radius:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.notif-item.unread{background:#fffaf6}
.notif-item .n-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.notif-item .body{flex:1}
.notif-item .body b{font-size:14px}
.notif-item .body p{color:var(--muted);font-size:13px}
.notif-item .when{font-size:12px;color:var(--muted);white-space:nowrap}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);display:inline-block;margin-left:6px}
.profile-head{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.profile-head .avatar{width:72px;height:72px;font-size:26px}
.two-col{grid-template-columns:1.4fr 1fr}

/* ---------- Modal / Toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:24px;max-height:90vh;overflow:auto;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal h3{font-size:18px;margin-bottom:6px}
.modal p{color:var(--muted)}
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:120}
.toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px;font-size:13px;animation:pop .2s}
.toast.ok svg{color:var(--green)}
.toast.err svg{color:var(--red)}
.loader{display:flex;justify-content:center;padding:60px}
.loader i{width:36px;height:36px;border-radius:50%;border:4px solid var(--orange-soft);border-top-color:var(--orange);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.backdrop{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1280px){
  .row3{grid-template-columns:1fr 1fr}
  .row3 .track-card{grid-column:1/-1;order:-1}
  .row-bottom{grid-template-columns:1fr 1fr}
  .row-bottom .promo{grid-column:1/-1}
  .quick{grid-template-columns:repeat(3,1fr)}
  .addr-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:1024px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .main{margin-left:0}
  .menu-btn{display:grid}
  .stats{grid-template-columns:repeat(2,1fr)}
  .row-ov{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .hero .truck{opacity:.35;width:80%}
}
@media (max-width:640px){
  .main{padding:12px}
  .stats,.row3,.row-bottom,.addr-grid{grid-template-columns:1fr}
  .quick{grid-template-columns:repeat(2,1fr)}
  .form-grid,.kv{grid-template-columns:1fr}
  .hero{padding:24px}
  .hero h2{font-size:26px}
  .hero .truck,.hero .road{display:none}
  .profile div.pinfo,.search{display:none}
  .help p{max-width:100%}
  .help .agent{display:none}
  .steps{padding:14px 6px}
  .steps::before,.steps .bar{left:40px;right:40px}
}

/* ===== Exact-design overrides ===== */
.sidebar{width:233px;padding:20px 16px}
.main{margin-left:233px}
.brand{margin-bottom:30px}
.brand .logo-img{width:108px;height:auto;display:block;margin-bottom:2px}
.brand h1{font-size:25px}
.nav{gap:6px}
.nav a{padding:13px 18px;font-size:14.5px;gap:16px;color:#d4d9e6}
.nav a.active{background:var(--orange);box-shadow:0 6px 16px rgba(255,107,26,.3)}
.nav a svg.i{width:22px;height:22px}
.side-promo{height:auto;background:none;border-radius:14px;margin:auto 0 18px}
.side-promo img{display:block;width:100%;border-radius:14px}
.logout{margin-bottom:6px;padding:13px;font-size:15px}
.avatar.photo{background:none;overflow:hidden}
.avatar.photo img{width:100%;height:100%;object-fit:cover;display:block}
.hero{background:#171c2b;min-height:196px;padding:30px 42px 28px;border-radius:18px}
.hero::before{content:"";position:absolute;inset:0 0 0 auto;width:58%;top:0;border-radius:0;background:var(--hero-img) right center/cover no-repeat}
.hero::after{content:"";position:absolute;top:0;bottom:0;left:30%;width:34%;background:linear-gradient(90deg,#171c2b 10%,rgba(23,28,43,0))}
.hero > *{position:relative;z-index:1}
.hero .accent{width:36px;height:4px;margin-bottom:16px}
.hero h2{font-size:35px;letter-spacing:-.3px}
.hero p{font-size:17px;max-width:480px;margin:10px 0 20px;line-height:1.4}
.hero .btn{padding:10px 22px;font-size:15px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.stat{padding:18px 20px;min-height:98px}
.stat .bubble{width:58px;height:58px}
.stat small{font-size:14px;color:#4b5263;font-weight:500}
.stat b{font-size:26px}
.stat .trend{top:22px}
.stat .spark{width:46%;bottom:4px}
.row3{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.07fr);gap:14px;margin-bottom:16px}
.thumb{width:62px;height:45px;overflow:hidden;background:#eee}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.order-row{padding:9px 0}
.order-row .meta b{font-size:14.5px}
.order-row .chev{width:28px;height:28px;border-radius:50%;background:var(--gray-soft);display:grid;place-items:center;color:var(--text)}
.order-row .chev svg{width:15px;height:15px}
.track-card .card-head{padding:13px 18px}
.track-card .card-head h3{font-size:16px}
.inv-row{padding:16px 0}
.inv-row .meta b{font-size:14.5px}
.row-bottom{grid-template-columns:minmax(0,1.05fr) minmax(0,1.5fr) minmax(0,.96fr);gap:14px}
.promo{background:#1a1f2e;padding:26px 24px;min-height:142px}
.promo::before{content:"";position:absolute;inset:0 0 0 auto;width:62%;background:var(--promo-img) right center/cover no-repeat}
.promo::after{content:"";position:absolute;top:0;bottom:0;left:28%;width:30%;background:linear-gradient(90deg,#1a1f2e 15%,rgba(26,31,46,0))}
.promo > *{position:relative;z-index:1}
.promo h3{font-size:22px}
.promo p{margin:4px 0 14px}
.help{background:linear-gradient(110deg,#fff7f1 0%,#ffe9d9 100%);padding:22px 22px}
.help img.agent{position:absolute;right:0;bottom:0;height:100%;width:auto;border-radius:0 var(--radius) var(--radius) 0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%)}
.help > *:not(.agent){position:relative;z-index:1}
.help p{max-width:62%}
.act{padding:11px 0;border:none}
.act .a-ico{width:26px;height:26px;background:none!important}
.act .a-ico svg{width:20px;height:20px}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#d5d9e2;border-radius:20px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + span{background:var(--orange)}
.switch input:checked + span::after{transform:translateX(20px)}
.set-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row div{flex:1}.set-row small{color:var(--muted);display:block;font-size:12px}
@media (max-width:1280px){.row3{grid-template-columns:1fr 1fr}.row-bottom{grid-template-columns:1fr 1fr}}
@media (max-width:1024px){.main{margin-left:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero::before{width:100%;opacity:.35}.hero::after{display:none}}
@media (max-width:640px){.stats,.row3,.row-bottom{grid-template-columns:1fr}.hero::before{display:none}}
.hero{padding:26px 42px 24px}
.hero::before{width:60%}
.hero::after{left:40%;width:22%;background:linear-gradient(90deg,#171c2b 0%,rgba(23,28,43,.6) 45%,rgba(23,28,43,0) 100%)}
.hero h2{font-size:33px;line-height:1.2}
.hero p{font-size:16px;margin:8px 0 18px}
.promo::before{width:60%}
.promo::after{left:40%;width:24%;background:linear-gradient(90deg,#1a1f2e 0%,rgba(26,31,46,.6) 45%,rgba(26,31,46,0) 100%)}
.act{padding:9px 0}
.act > span:not(.a-ico){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.row-bottom .card{padding:16px 20px}

function exportCSV(rows, cols, name){
  const lines=[cols.map(c=>c[1]).join(',')].concat(rows.map(r=>cols.map(c=>`"${String(r[c[0]]??'').replace(/"/g,'""')}"`).join(',')));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'})); a.download=name+'.csv'; a.click();
  toast('Exported '+name+'.csv');
}

/* Reusable data table: search + filter tabs + sort + pagination */
const tableState = {};
function dataTable(key, {rows, cols, tabs, tabField, searchFields, actions, pageSize=6, exportName}){
  const st = tableState[key] ||= {tab:'All',q:'',sort:null,dir:1,page:1,from:'',to:''};
  let r = rows.slice();
  if(tabs && st.tab!=='All') r = r.filter(x => x[tabField]===st.tab);
  if(st.q) r = r.filter(x => searchFields.some(f => String(x[f]).toLowerCase().includes(st.q.toLowerCase())));
  if(st.from) r = r.filter(x => x.date >= st.from);
  if(st.to) r = r.filter(x => x.date <= st.to);
  if(st.sort) r.sort((a,b)=> (a[st.sort]>b[st.sort]?1:a[st.sort]<b[st.sort]?-1:0)*st.dir);
  const pages = Math.max(1, Math.ceil(r.length/pageSize)); st.page=Math.min(st.page,pages);
  const slice = r.slice((st.page-1)*pageSize, st.page*pageSize);
  window['__rows_'+key] = r;
  return `
  ${tabs?`<div class="tabs">${tabs.map(t=>`<button class="${st.tab===t?'active':''}" onclick="tState('${key}','tab','${t}')">${t} <span style="opacity:.6">(${t==='All'?rows.length:rows.filter(x=>x[tabField]===t).length})</span></button>`).join('')}</div>`:''}
  <div class="card">
    <div class="toolbar">
      <div class="field-inline">${ico('search','i','width:16px;height:16px;color:var(--muted)')}<input placeholder="Search by ID, location…" value="${esc(st.q)}" oninput="tState('${key}','q',this.value,true)"></div>
      <div class="field-inline"><small style="color:var(--muted)">From</small><input type="date" value="${st.from}" onchange="tState('${key}','from',this.value)"></div>
      <div class="field-inline"><small style="color:var(--muted)">To</small><input type="date" value="${st.to}" onchange="tState('${key}','to',this.value)"></div>
      <div class="spacer"></div>
      ${exportName?`<button class="btn btn-outline btn-sm" onclick="exportCSV(window['__rows_${key}'],${esc(JSON.stringify(cols.filter(c=>c[0]).map(c=>[c[0],c[1]])))},'${exportName}')">${ico('export','i','width:16px;height:16px')}Export CSV</button>`:''}
    </div>
    <div class="table-wrap"><table>
      <thead><tr>${cols.map(c=>`<th ${c[0]?`onclick="tSort('${key}','${c[0]}')"`:''}>${c[1]}${st.sort===c[0]?(st.dir>0?' ▲':' ▼'):''}</th>`).join('')}${actions?'<th>Actions</th>':''}</tr></thead>
      <tbody>${slice.length?slice.map(x=>`<tr>${cols.map(c=>`<td>${c[2]?c[2](x):esc(x[c[0]])}</td>`).join('')}${actions?`<td style="white-space:nowrap">${actions(x)}</td>`:''}</tr>`).join('')
        :`<tr><td colspan="${cols.length+(actions?1:0)}"><div class="empty">${ico('box','i','width:40px;height:40px;opacity:.4')}<p>No records found</p></div></td></tr>`}</tbody>
    </table></div>
    <div class="pager"><span>Showing ${slice.length?(st.page-1)*pageSize+1:0}–${(st.page-1)*pageSize+slice.length} of ${r.length}</span>
      <div class="pg"><button ${st.page<=1?'disabled':''} onclick="tState('${key}','page',${st.page-1})">‹</button>${Array.from({length:pages},(_,i)=>`<button class="${st.page===i+1?'active':''}" onclick="tState('${key}','page',${i+1})">${i+1}</button>`).join('')}<button ${st.page>=pages?'disabled':''} onclick="tState('${key}','page',${st.page+1})">›</button></div></div>
  </div>`;
}
function tState(key,f,v,keepFocus){ const st=tableState[key]; st[f]=v; if(f!=='page') st.page=1;
  const pos = keepFocus ? document.activeElement.selectionStart : null; render();
  if(keepFocus){ const inp=document.querySelector('.toolbar input'); if(inp){ inp.focus(); inp.setSelectionRange(pos,pos);} } }
function tSort(key,f){ const st=tableState[key]; if(st.sort===f) st.dir*=-1; else {st.sort=f; st.dir=1;} render(); }

function placeTruck(progress){
  const p=document.getElementById('routeP'), t=document.getElementById('mapTruck'); if(!p||!t) return;
  const L=p.getTotalLength(), pt=p.getPointAtLength(L*progress/100), pt2=p.getPointAtLength(Math.min(L, L*progress/100+2));
  const ang=Math.atan2(pt2.y-pt.y, pt2.x-pt.x)*180/Math.PI;
  t.setAttribute('transform',`translate(${pt.x} ${pt.y-6}) rotate(${ang})`);
}

pages['create-order'] = () => {
  const pick=db.addresses.filter(a=>a.tag==='Pickup'), del=db.addresses.filter(a=>a.tag==='Delivery');
  const today=new Date().toISOString().slice(0,10);
  const f=(id,label,input,full,req=true,msg='This field is required')=>`<div class="field ${full?'full':''}" id="f-${id}"><label>${label} ${req?'<span class="req">*</span>':''}</label>${input}<div class="msg">${msg}</div></div>`;
  return `
  <div class="page-title"><h2>Create New Order</h2><p>Book transportation – fill pickup, delivery and goods details. Your order goes for approval once submitted.</p></div>
  <form class="card" id="orderForm" novalidate>
    <div class="form-grid">
      <div class="form-section">${ico('pin')} Pickup &amp; Delivery</div>
      ${f('pickup','Pickup address',`<select name="pickup"><option value="">Select saved pickup address</option>${pick.map(a=>`<option>${esc(a.label)} – ${esc(a.city)}</option>`).join('')}</select>`)}
      ${f('delivery','Delivery address',`<select name="delivery"><option value="">Select saved delivery address</option>${del.map(a=>`<option>${esc(a.label)} – ${esc(a.city)}</option>`).join('')}</select>`)}
      ${f('pdate','Pickup date',`<input type="date" name="pdate" min="${today}">`,false,true,'Choose a pickup date (today or later)')}
      ${f('ddate','Expected delivery date',`<input type="date" name="ddate" min="${today}">`,false,true,'Delivery date must be after pickup date')}
      <div class="form-section">${ico('box')} Goods Details</div>
      ${f('cat','Goods category',`<select name="cat"><option value="">Select category</option>${Object.keys(CATS).map(c=>`<option>${c}</option>`).join('')}</select>`)}
      ${f('pkgs','Number of packages',`<input type="number" name="pkgs" min="1" placeholder="e.g. 40">`,false,true,'Enter at least 1 package')}
      ${f('desc','Goods description',`<input name="desc" placeholder="e.g. Spice sacks, 30kg each">`,true)}
      ${f('weight','Total weight (kg)',`<input type="number" name="weight" min="1" placeholder="e.g. 1200">`,false,true,'Enter a valid weight in kg')}
      ${f('dims','Package dimensions (L×W×H cm)',`<input name="dims" placeholder="Optional – e.g. 60×40×40">`,false,false)}
      ${f('notes','Special handling instructions',`<textarea name="notes" placeholder="Fragile, keep upright, cold chain, etc."></textarea>`,true,false)}
      <div class="form-section">${ico('user')} Contact Person</div>
      ${f('cname','Contact name',`<input name="cname" value="${esc(db.user.full)}">`)}
      ${f('cphone','Contact phone',`<input name="cphone" value="${esc(db.user.phone)}" placeholder="+91 XXXXX XXXXX">`,false,true,'Enter a valid 10-digit Indian mobile number')}
    </div>
    <div class="form-actions"><button type="reset" class="btn btn-ghost">Clear</button><button type="submit" class="btn btn-primary" id="orderSubmit">Submit Order ${ico('arrow','i','width:18px')}</button></div>
  </form>`;
};
pages['create-order'].after = () => {
  const form=document.getElementById('orderForm');
  form.addEventListener('submit', async e => {
    e.preventDefault(); const d=Object.fromEntries(new FormData(form)); let ok=true;
    const setErr=(id,bad)=>{ document.getElementById('f-'+id).classList.toggle('err',bad); if(bad) ok=false; };
    ['pickup','delivery','cat','desc','cname'].forEach(k=>setErr(k,!d[k].trim()));
    setErr('pdate',!d.pdate);
    setErr('ddate',!d.ddate || (d.pdate && d.ddate < d.pdate));
    setErr('pkgs',!(+d.pkgs>=1));
    setErr('weight',!(+d.weight>0));
    setErr('cphone',!/^(\+91[\s-]?)?[6-9]\d{4}\s?\d{5}$/.test(d.cphone.trim()));
    if(!ok){ toast('Please fix the highlighted fields','err'); return; }
    if(d.pickup===d.delivery){ toast('Pickup and delivery cannot be the same','err'); return; }
    const btn=document.getElementById('orderSubmit'); btn.disabled=true; btn.textContent='Submitting…';
    const id='ORD'+(Math.max(...db.orders.map(o=>+o.id.slice(3)))+1);
    await api.createOrder({id,date:new Date().toISOString().slice(0,10),cat:d.cat,desc:d.desc,pkgs:+d.pkgs,weight:+d.weight,from:d.pickup.split(' – ')[1],to:d.delivery.split(' – ')[1],status:'Pending',amount:Math.round(+d.weight*3.4+500),shipment:null});
    db.notifications.unshift({id:Date.now(),type:'confirm',title:'Order confirmation',text:`Order #${id} placed and awaiting approval.`,when:'Just now',unread:true});
    db.activity.unshift({ico:'box',color:'var(--orange)',bg:'var(--orange-soft)',text:`Order #${id} placed`,when:'Just now'});
    toast(`Order #${id} submitted for approval`); location.hash='orders';
  });
  form.querySelectorAll('input,select,textarea').forEach(el=>el.addEventListener('input',()=>el.closest('.field')?.classList.remove('err')));
};

function orderDetails(id){
  const o=db.orders.find(x=>x.id===id); const s=db.shipments.find(x=>x.order===id);
  openModal(`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">${thumb(o.cat)}<div><h3>Order #${o.id}</h3>${badge(o.status)}</div><button class="icon-btn" style="margin-left:auto" onclick="closeModal()">${ico('x')}</button></div>
  <div class="kv"><div><small>Placed on</small><b>${fmtDate(o.date)}</b></div><div><small>Category</small><b>${o.cat}</b></div>
  <div><small>Pickup</small><b>${o.from}</b></div><div><small>Destination</small><b>${o.to}</b></div>
  <div><small>Packages</small><b>${o.pkgs}</b></div><div><small>Weight</small><b>${o.weight} kg</b></div>
  <div><small>Description</small><b>${esc(o.desc)}</b></div><div><small>Freight amount</small><b>${inr(o.amount)}</b></div></div>
  <div class="form-actions">${s?`<button class="btn btn-primary" onclick="closeModal();location.hash='tracking/${s.id}'">${ico('pin','i','width:16px')}Track Shipment</button>`:''}
  ${['Pending','Approved'].includes(o.status)?`<button class="btn btn-ghost" style="color:var(--red)" onclick="cancelOrder('${o.id}')">Cancel Order</button>`:''}</div>`);
}
function cancelOrder(id){ confirmDialog('Cancel order #'+id+'?','Cancellation is only allowed before pickup. Any amount paid will be refunded as per policy.','Yes, cancel order', async()=>{ await api.cancelOrder(id); toast('Order #'+id+' cancelled'); render(); }, true); }

function payInvoice(id){
  const inv=db.invoices.find(i=>i.id===id);
  openModal(`<h3>Make Payment</h3><p>Invoice <b>${inv.id}</b> · Order #${inv.order}</p>
    <div style="background:var(--bg);border-radius:12px;padding:16px;margin:16px 0;display:flex;justify-content:space-between;align-items:center"><span>Amount payable</span><b style="font-size:22px">${inr(inv.amount)}</b></div>
    <div class="field"><label>Payment method</label><select id="payMethod"><option>UPI</option><option>Net Banking</option><option>Card</option></select></div>
    <p style="font-size:12px;margin-top:10px">${ico('lock','i','width:13px;vertical-align:-2px')} You'll be redirected to the secure payment gateway to complete this payment. Payment status is confirmed by the server, not the browser.</p>
    <div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="payBtn">Confirm &amp; Pay ${inr(inv.amount)}</button></div>`);
  document.getElementById('payBtn').onclick = async () => { const b=document.getElementById('payBtn'); b.disabled=true; b.textContent='Processing…';
    const t=await api.pay(id, document.getElementById('payMethod').value);
    db.notifications.unshift({id:Date.now(),type:'payment',title:'Payment confirmation',text:`Payment of ${inr(t.amount)} received for ${id}.`,when:'Just now',unread:true});
    closeModal(); toast(`Payment of ${inr(t.amount)} successful – ${t.id}`); render(); };
}

pages.profile.after = () => {
  document.getElementById('profileForm').onsubmit = e => { e.preventDefault(); const d=Object.fromEntries(new FormData(e.target)); let ok=true;
    const set=(k,b)=>{document.getElementById('pf-'+k).classList.toggle('err',b); if(b) ok=false;};
    set('full',!d.full.trim()); set('email',!/^\S+@\S+\.\S+$/.test(d.email)); set('phone',!/^(\+91[\s-]?)?[6-9]\d{4}\s?\d{5}$/.test(d.phone.trim())); if(!ok) return;
    Object.assign(db.user,d); db.user.name=d.full.split(' ')[0]; toast('Profile updated'); render(); };
  document.getElementById('pwForm').onsubmit = e => { e.preventDefault(); const d=Object.fromEntries(new FormData(e.target)); let ok=true;
    const set=(k,b)=>{document.getElementById('pw-'+k).classList.toggle('err',b); if(b) ok=false;};
    set('cur',!d.cur); set('new',!(d.nw.length>=8&&/[A-Za-z]/.test(d.nw)&&/\d/.test(d.nw))); set('cf',d.nw!==d.cf||!d.cf); if(!ok) return;
    e.target.reset(); toast('Password updated successfully'); };
};

/* ---------- SETTINGS ---------- */
const settings = {email:true,sms:true,whatsapp:false,delay:true,payment:true,lang:'English'};
pages.settings = () => {
  const row=(k,t,d)=>`<div class="set-row"><div><b>${t}</b><small>${d}</small></div><label class="switch"><input type="checkbox" ${settings[k]?'checked':''} onchange="settings['${k}']=this.checked;toast('Setting saved')"><span></span></label></div>`;
  return `<div class="page-title"><h2>Settings</h2></div>
  <div class="grid two-col">
    <div class="card"><div class="card-head"><span class="ico">${ico('bell')}</span><h3>Notification Preferences</h3></div>
      ${row('email','Email updates','Order confirmation, approval and invoices by email')}
      ${row('sms','SMS alerts','Shipment dispatched, out for delivery and delivered')}
      ${row('whatsapp','WhatsApp updates','Live tracking link and delivery alerts on WhatsApp')}
      ${row('delay','Delay alerts','Notify me when a shipment is delayed')}
      ${row('payment','Payment confirmations','Receipt when a payment is received')}</div>
    <div class="card" style="align-self:start"><div class="card-head"><span class="ico">${ico('gear')}</span><h3>Account</h3></div>
      <div class="field" style="margin-bottom:14px"><label>Language</label><select onchange="settings.lang=this.value;toast('Language saved')">${['English','తెలుగు','हिन्दी','தமிழ்'].map(l=>`<option ${settings.lang===l?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="set-row"><div><b>Change password</b><small>Update your login password</small></div><a class="btn btn-ghost btn-sm" href="#profile/password">Change</a></div>
      <div class="set-row"><div><b>Saved addresses</b><small>Pickup and delivery addresses</small></div><a class="btn btn-ghost btn-sm" href="#addresses">Manage</a></div>
      <div class="set-row"><div><b>Logout</b><small>Sign out of the customer portal</small></div><button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="confirmLogout()">Logout</button></div></div>
  </div>`;
};

/* ---------------- GLOBAL SEARCH ---------------- */
document.getElementById('globalSearch').addEventListener('input', e => {
  const q=e.target.value.trim().toLowerCase(), box=document.getElementById('searchResults');
  if(!q){ box.style.display='none'; return; }
  const res=[...db.orders.filter(o=>(o.id+o.from+o.to+o.cat).toLowerCase().includes(q)).map(o=>`<a href="#orders" onclick="orderDetails('${o.id}')">${ico('orders','i','width:14px;vertical-align:-2px')} Order #${o.id} · ${o.status}</a>`),
    ...db.shipments.filter(s=>(s.id+s.order+s.vehicle).toLowerCase().includes(q)).map(s=>`<a href="#tracking/${s.id}">${ico('truck','i','width:14px;vertical-align:-2px')} Shipment ${s.id} · ${s.status}</a>`),
    ...db.invoices.filter(i=>i.id.toLowerCase().includes(q)).map(i=>`<a href="#invoices">${ico('invoice','i','width:14px;vertical-align:-2px')} ${i.id} · ${inr(i.amount)}</a>`)].slice(0,8);
  box.innerHTML = res.join('') || '<div style="padding:10px;color:var(--muted);font-size:13px">No matches</div>'; box.style.display='block';
});

/* ---------------- ROUTER ---------------- */
function render(){
  const [route,param] = (location.hash.slice(1)||'dashboard').split('/');
  const page = pages[route] || pages.dashboard;
  renderNav(pages[route]?route:'dashboard');
  document.getElementById('view').innerHTML = page(param);
  page.after && page.after(param);
}
let lastRoute='';
window.addEventListener('hashchange', () => {
  const r=location.hash; toggleSidebar(false); document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('open'));
  if(r.split('/')[0]!==lastRoute.split('/')[0]){ document.getElementById('view').innerHTML='<div class="loader"><i></i></div>'; setTimeout(()=>{render();window.scrollTo(0,0);},180); } else render();
  lastRoute=r;
});
lastRoute=location.hash; render();
</script>
</body>
